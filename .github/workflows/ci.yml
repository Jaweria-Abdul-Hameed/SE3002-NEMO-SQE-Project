name: SE3002 CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-and-unit-tests:
    name: 1. Static Linting, White-Box Unit & API Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-django coverage requests flake8 cosmic-ray "urllib3<2" pyyaml

      - name: Static Analysis & Flake8 Lint Check
        run: |
          flake8 NEMO/views/access_requests.py NEMO/forms.py tests/team/unit tests/team/api tests/team/recovery --max-line-length=160 --ignore=E501,W503,E203,E402,F401,F403,F405,E722,E713

      - name: Run Pytest Suites with Statement & Branch Coverage
        env:
          DJANGO_SETTINGS_MODULE: sqe_local.settings
          PYTHONPATH: .
        run: |
          coverage run --source=NEMO/views/access_requests.py,NEMO/forms.py,NEMO/models.py --branch -m pytest tests/team/unit tests/team/api tests/team/recovery --reuse-db -v
          coverage report -m
          coverage json -o coverage.json
          coverage xml -o coverage.xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage.xml

  e2e-and-browser-tests:
    name: 2. Browser E2E, Usability & Role Access Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed SQLite Database
        env:
          DJANGO_SETTINGS_MODULE: sqe_local.settings
          PYTHONPATH: .
          PYTHON_BIN: python3
        run: |
          python3 scripts/reset_local_db.py

      - name: Run Playwright Chromium Suites (E2E, Usability, Security)
        env:
          DJANGO_SETTINGS_MODULE: sqe_local.settings
          PYTHONPATH: .
          PYTHON_BIN: python3
        run: |
          npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/evidence/phase5/playwright-html-report/

  mutation-and-quality-gate:
    name: 3. Mutation Gate & Strict Non-Bypassable PR Quality Gate
    needs: [static-and-unit-tests, e2e-and-browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: .

      - name: Verify Strict Non-Bypassable PR Quality Gate
        run: |
          python scripts/ci_quality_gate_check.py --min-stmt 90.0 --min-branch 85.0 --min-mutation 90.0 --coverage-file coverage.json
